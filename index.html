<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>F1 Dashboard</h1>

    <section>
      <h2>Driver standings</h2>

      <!-- Shows "Loading..." first, then an error message if the fetch fails -->
      <p id="standings-status">Loading standings…</p>

      <!-- Hidden until the data arrives; standings.js fills the <tbody> with rows -->
      <div class="table-wrap">
        <table id="driver-table" hidden>
          <thead>
            <tr>
              <th>Pos</th>
              <th>Driver</th>
              <th>Team</th>
              <th class="num">Points</th>
            </tr>
          </thead>
          <tbody id="driver-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Plain script tag (not type="module") so this works when you just double-click index.html -->
  <script src="standings.js"></script>
</body>
</html>
